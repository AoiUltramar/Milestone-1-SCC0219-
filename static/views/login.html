    <div class="wrap">
        <div class="page-head">
            <h1>Sign in or create an account</h1>
            <p>Customers and store administrators use the same sign-in. We'll take you to the right place.</p>
        </div>
        <div class="split even">
            <section class="panel" aria-labelledby="signin-title">
                <h2 id="signin-title">Sign in</h2>
                <form id="signin-form" action="/account">
                    <div class="field">
                        <label for="login-user">Email or username</label>
                        <input id="login-user" name="login" type="text" autocomplete="username" required placeholder="e.g. admin">
                    </div>
                    <div class="field">
                        <label for="login-pass">Password</label>
                        <input id="login-pass" name="password" type="password" autocomplete="current-password" required>
                        <p class="hint">Administrators: the default account is <strong>admin</strong> / <strong>admin</strong>.</p>
                    </div>
                    <button class="btn" type="submit">Sign in</button>
                </form>
                <div class="notice warn" id="signin-error" role="alert" tabindex="-1" style="margin-top: 1.25rem;" hidden></div>
            </section>

            <section class="panel tinted" aria-labelledby="reg-title">
                <h2 id="reg-title">Create an account</h2>
                <p>New here? Your account comes with one free 14-day Standard VM trial.</p>
                <form id="register-form" action="/trial">
                    <div class="field">
                        <label for="reg-name">Full name</label>
                        <input id="reg-name" name="name" type="text" autocomplete="name" placeholder="e.g. Ana Souza" required>
                    </div>
                    <div class="field-row">
                        <div class="field">
                            <label for="reg-email">Email</label>
                            <input id="reg-email" name="email" type="email" autocomplete="email" required>
                        </div>
                        <div class="field">
                            <label for="reg-phone">Phone</label>
                            <input id="reg-phone" name="phone" type="tel" autocomplete="tel" placeholder="(11) 91234-5678" required>
                        </div>
                    </div>
                    <div class="field">
                        <label for="reg-address">Billing address</label>
                        <input id="reg-address" name="address" type="text" autocomplete="street-address" placeholder="Street, number, apartment" required>
                    </div>
                    <div class="field-row">
                        <div class="field">
                            <label for="reg-city">City</label>
                            <input id="reg-city" name="city" type="text" autocomplete="address-level2" value="São Paulo">
                        </div>
                        <div class="field">
                            <label for="reg-cep">CEP</label>
                            <input id="reg-cep" name="cep" type="text" inputmode="numeric" autocomplete="postal-code" placeholder="00000-000">
                        </div>
                    </div>
                    <div class="field">
                        <label for="reg-pass">Password</label>
                        <input id="reg-pass" name="password" type="password" autocomplete="new-password" minlength="8" required aria-describedby="reg-pass-hint">
                        <p class="hint" id="reg-pass-hint">At least 8 characters.</p>
                    </div>
                    <button class="btn" type="submit">Create account</button>
                </form>
                <div class="notice warn" id="register-error" role="alert" tabindex="-1" style="margin-top: 1.25rem;" hidden></div>
            </section>
        </div>
    </div>
